<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profile — Monster Under The Bed</title>
<link rel="stylesheet" href="style.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;1,400&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050302;color:#e8e0d0;font-family:'Crimson Text',serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 20px;gap:20px}
h1{font-family:'Cinzel',serif;font-size:14px;color:#c0392b;letter-spacing:.2em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:280px 1fr;gap:18px;width:100%;max-width:780px}
@media(max-width:620px){.grid{grid-template-columns:1fr}}
.card{background:#0a0705;border:1px solid #2a1410;padding:24px}
.avatar{width:60px;height:60px;background:#3a1008;border:2px solid #c0392b;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:22px;color:#e8e0d0;margin-bottom:12px}
.uname{font-family:'Cinzel',serif;font-size:17px;color:#e8e0d0;letter-spacing:.06em}
.ulevel{font-family:'Cinzel',serif;font-size:10px;color:#d4af37;letter-spacing:.15em;text-transform:uppercase;margin:3px 0 14px}
.xp-wrap{background:#1a1210;border:1px solid #2a1410;height:7px;border-radius:4px;overflow:hidden;margin:4px 0}
.xp-fill{height:100%;background:linear-gradient(to right,#6e1f18,#c0392b);border-radius:4px;transition:width .7s}
.xp-txt{font-size:11px;color:#4a3030;font-style:italic;margin-top:3px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.sbox{background:#0d0905;border:1px solid #2a1410;padding:10px 12px;text-align:center}
.sval{font-family:'Cinzel',serif;font-size:20px;color:#e8e0d0}
.sval.g{color:#2ecc71}.sval.r{color:#c0392b}.sval.gold{color:#d4af37}
.slbl{font-size:11px;color:#4a3030;font-style:italic;margin-top:2px}
.ach-title{font-family:'Cinzel',serif;font-size:11px;color:#6a5040;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.ach-item{display:flex;gap:10px;align-items:flex-start;background:#0d0905;border:1px solid #2a1410;padding:10px 13px;margin-bottom:7px}
.ach-item.earned{border-color:#d4af37}
.ach-item.locked{opacity:.32;filter:grayscale(.7)}
.ai-icon{font-size:20px;line-height:1;flex-shrink:0}
.ai-name{font-family:'Cinzel',serif;font-size:11px;color:#d4af37;letter-spacing:.05em}
.ai-desc{font-size:12px;color:#6a5040;font-style:italic;margin-top:2px}
.ai-xp{font-size:10px;color:#4a3030;margin-top:2px}
.nav{display:flex;gap:10px}
.nav a,.nav button{font-family:'Cinzel',serif;font-size:12px;padding:8px 18px;cursor:pointer;border:1px solid #2a1410;background:transparent;color:#c8c0b0;letter-spacing:.06em;text-decoration:none;display:inline-block;transition:all .15s}
.nav a:hover,.nav button:hover{background:#3a1008;border-color:#c0392b;color:#f0e8d8}
.err{color:#c0392b;font-style:italic;text-align:center;padding:40px}
</style>
</head>
<body>
<h1>Player Profile</h1>
<div class="grid" id="grid"><div class="err">Loading…</div></div>
<div class="nav">
  <a href="index.html">← Menu</a>
  <a href="leaderboard.html">Leaderboard</a>
  <a href="chapter1.html">Play</a>
</div>
<script src="api.js"></script>
<script>
function fmt(s){if(s===null||s===undefined)return'—';return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function levelTitle(l){
  if(l<3)return'Frightened Child';if(l<5)return'Night Wanderer';
  if(l<8)return'Shadow Runner';if(l<12)return'Creature of Night';return'Monster Whisperer';
}
async function load(){
  if(!API.isLoggedIn()){
    document.getElementById('grid').innerHTML='<div class="err" style="grid-column:1/-1">You must be signed in to view your profile.<br><br><a href="index.html" style="color:#c0392b">← Back to Menu</a></div>';
    return;
  }
  const r=await API.profile();
  if(r.error){document.getElementById('grid').innerHTML=`<div class="err">${r.error}</div>`;return;}
  const u=r.user, all=r.allAchievements||[];
  const pct=Math.round((u.xp/u.xpToNext)*100);
  const left=`<div class="card">
    <div class="avatar">${u.username[0].toUpperCase()}</div>
    <div class="uname">${u.username}</div>
    <div class="ulevel">Level ${u.level} — ${levelTitle(u.level)}</div>
    <div style="font-family:'Cinzel',serif;font-size:9px;color:#4a3030;letter-spacing:.1em;margin-bottom:4px">XP TO LEVEL ${u.level+1}</div>
    <div class="xp-wrap"><div class="xp-fill" style="width:${pct}%"></div></div>
    <div class="xp-txt">${u.xp} / ${u.xpToNext} XP &nbsp;(${pct}%)</div>
    <div class="stat-grid">
      <div class="sbox"><div class="sval">${u.stats.totalRuns}</div><div class="slbl">Total Runs</div></div>
      <div class="sbox"><div class="sval g">${u.stats.totalEscapes}</div><div class="slbl">Escapes</div></div>
      <div class="sbox"><div class="sval r">${u.stats.totalCaught}</div><div class="slbl">Times Caught</div></div>
      <div class="sbox"><div class="sval gold">${u.stats.highScore.toLocaleString()}</div><div class="slbl">High Score</div></div>
      <div class="sbox"><div class="sval">${u.stats.totalPages}</div><div class="slbl">Pages Found</div></div>
      <div class="sbox"><div class="sval">${fmt(u.stats.bestTime)}</div><div class="slbl">Best Time</div></div>
    </div>
  </div>`;
  const items=all.map(a=>{
    const earned=u.achievements.includes(a.id);
    return`<div class="ach-item ${earned?'earned':'locked'}">
      <div class="ai-icon">${a.icon}</div>
      <div>
        <div class="ai-name">${a.title}${earned?'':' 🔒'}</div>
        <div class="ai-desc">${a.desc}</div>
        ${a.xp>0?`<div class="ai-xp">+${a.xp} XP</div>`:''}
      </div>
    </div>`;
  }).join('');
  const right=`<div class="card"><div class="ach-title">Achievements (${u.achievements.length}/${all.length})</div>${items}</div>`;
  document.getElementById('grid').innerHTML=left+right;
}
load();
</script>
</body>
</html>
