<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leaderboard — Monster Under The Bed</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;1,400&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050302;color:#e8e0d0;font-family:'Crimson Text',serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 20px;gap:20px}
h1{font-family:'Cinzel',serif;font-size:14px;color:#c0392b;letter-spacing:.2em;text-transform:uppercase}
.wrap{width:100%;max-width:580px}
.header{display:grid;grid-template-columns:44px 1fr 90px 60px 60px;gap:6px;padding:8px 14px;font-family:'Cinzel',serif;font-size:9px;color:#4a3030;letter-spacing:.12em;border-bottom:1px solid #2a1410;text-transform:uppercase}
.row{display:grid;grid-template-columns:44px 1fr 90px 60px 60px;gap:6px;padding:10px 14px;border-bottom:1px solid rgba(42,20,16,.5);transition:background .1s;align-items:center}
.row:hover{background:rgba(58,16,8,.2)}
.row.me{background:rgba(110,31,24,.18);border-left:2px solid #c0392b}
.rank{font-family:'Cinzel',serif;font-size:14px;color:#4a3030}
.rank.g{color:#d4af37}.rank.s{color:#aaa}.rank.b{color:#c07840}
.uname{font-family:'Cinzel',serif;font-size:12px;color:#c8c0b0;letter-spacing:.04em}
.score{font-family:'Cinzel',serif;font-size:13px;color:#d4af37;text-align:right}
.val{font-size:12px;color:#6a5040;text-align:right}
.empty{text-align:center;padding:48px;color:#3a2820;font-style:italic}
.nav{display:flex;gap:10px}
.nav a{font-family:'Cinzel',serif;font-size:12px;padding:8px 18px;cursor:pointer;border:1px solid #2a1410;background:transparent;color:#c8c0b0;letter-spacing:.06em;text-decoration:none;transition:all .15s}
.nav a:hover{background:#3a1008;border-color:#c0392b;color:#f0e8d8}
</style>
</head>
<body>
<h1>🏆 Leaderboard</h1>
<div class="wrap">
  <div class="header">
    <span>#</span><span>Player</span><span style="text-align:right">Score</span><span style="text-align:right">Pages</span><span style="text-align:right">Time</span>
  </div>
  <div id="lb"><div class="empty">Loading…</div></div>
</div>
<div class="nav">
  <a href="index.html">← Menu</a>
  <a href="profile.html">My Profile</a>
  <a href="chapter1.html">Play Now</a>
</div>
<script src="api.js"></script>
<script>
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
async function load(){
  const r=await API.leaderboard();
  const lb=document.getElementById('lb');
  if(!r.scores||!r.scores.length){lb.innerHTML='<div class="empty">No scores yet — be the first to escape!</div>';return;}
  const me=API.username();
  lb.innerHTML=r.scores.map((s,i)=>{
    const n=i+1;
    const rc=n===1?'g':n===2?'s':n===3?'b':'';
    const medal=n===1?'🥇':n===2?'🥈':n===3?'🥉':n;
    const isMe=s.username===me;
    return`<div class="row${isMe?' me':''}">
      <span class="rank ${rc}">${medal}</span>
      <span class="uname">${s.username}${isMe?' <em style="color:#6a4030;font-size:10px">(you)</em>':''}</span>
      <span class="score">${s.score.toLocaleString()}</span>
      <span class="val">${s.pages}/8</span>
      <span class="val">${fmt(s.time)}</span>
    </div>`;
  }).join('');
}
load();
</script>
</body>
</html>
